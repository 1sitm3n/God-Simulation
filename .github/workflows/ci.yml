name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  # Headless. The test suite links godsim_lib, which is core + layers with no
  # GLFW and no OpenGL, so none of this needs a display or X11 headers.
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: "linux / gcc release", type: Release }
          # Debug carries ASan + UBSan with -fno-sanitize-recover, so a
          # sanitiser finding fails the build rather than printing and exiting 0.
          - { os: ubuntu-latest, name: "linux / gcc asan+ubsan", type: Debug }
          - { os: macos-14,      name: "macos arm64 / clang",   type: Release }
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DGODSIM_BUILD_RENDERER=OFF
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  # Separate job so the renderer doesn't rot while everything else is headless.
  # This is the only one that needs X11.
  renderer:
    name: linux / renderer builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: X11 headers for GLFW
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGODSIM_BUILD_RENDERER=ON
      - run: cmake --build build --parallel
